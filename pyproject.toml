[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowcarrycbf"
version = "0.1.0"
description = "RGB Flow Matching with predictive whole-body CBF-QP for safe TIAGo carrying"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "diffusers==0.39.0",
  "gymnasium==1.3.0",
  "h5py==3.16.0",
  "hydra-core==1.3.5",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
  "numcodecs==0.15.1",
  "numpy==1.26.0",
  "omegaconf==2.3.1",
  "opencv-python==4.11.0.86",
  "pynput==1.7.7",
  "osqp==0.6.7.post3",
  "scipy==1.15.3",
  "torch==2.7.0",
  "torchvision==0.22.0",
  "tqdm==4.70.0",
  "zarr==2.18.7",
]

[project.scripts]
flowcarrycbf-collect = "flowcarrycbf.cli.collect_data:main"
flowcarrycbf-convert = "flowcarrycbf.cli.convert_data:main"
flowcarrycbf-train = "flowcarrycbf.cli.train_policy:main"
flowcarrycbf-eval = "flowcarrycbf.cli.eval_policy:main"

[tool.setuptools.packages.find]
include = ["flowcarrycbf*"]

[tool.setuptools.package-data]
flowcarrycbf = [
  "config/*.yaml",
  "config/**/*.yaml",
  "robots/assets/urdf/**/*.urdf",
  "robots/assets/usd/**/*.usd",
  "robots/assets/usd/**/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
